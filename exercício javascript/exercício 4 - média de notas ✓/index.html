
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média do Aluno</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            display: block;
            margin: 10px auto;
            padding: 8px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .aprovado {
            color: green;
        }

        .recuperacao {
            color: #d4a000;
        }

        .reprovado {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Calculadora de Média</h1>

    <input type="number" id="nota1" placeholder="Digite a primeira nota" min="0" max="10" step="any">
    <input type="number" id="nota2" placeholder="Digite a segunda nota" min="0" max="10" step="any">
    <input type="number" id="nota3" placeholder="Digite a terceira nota" min="0" max="10" step="any">

    <button onclick="calcularMedia()">Calcular Média</button>

    <div id="resultado"></div>

    <script>
        function calcularMedia() {
            let nota1 = Number(document.getElementById("nota1").value);
            let nota2 = Number(document.getElementById("nota2").value);
            let nota3 = Number(document.getElementById("nota3").value);

            if (
                document.getElementById("nota1").value === "" ||
                document.getElementById("nota2").value === "" ||
                document.getElementById("nota3").value === "" ||
                nota1 < 0 || nota1 > 10 ||
                nota2 < 0 || nota2 > 10 ||
                nota3 < 0 || nota3 > 10
            ) {
                alert("Digite as três notas entre 0 e 10.");
                return;
            }

            let media = (nota1 + nota2 + nota3) / 3;
            let resultado = document.getElementById("resultado");

            if (media >= 7) {
                resultado.textContent =
                    "Média: " + media.toFixed(2) + " - Aprovado";
                resultado.className = "aprovado";
            } else if (media >= 5) {
                resultado.textContent =
                    "Média: " + media.toFixed(2) + " - Recuperação";
                resultado.className = "recuperacao";
            } else {
                resultado.textContent =
                    "Média: " + media.toFixed(2) + " - Reprovado";
                resultado.className = "reprovado";
            }
        }
    </script>

</body>
</html>
